<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>책들</title>
</head>
<body>
  <!-- UX 계획
  사용자: 여러 책을 동시에 읽으며 기록을 하는 사람
  목적: 기록의 메모 기능과 진행 방법을 이해한다.
  핵심 행동: 원하는 영역으로 이동하고 기록을 남기고 모아진 기록을 받아본다.
  정보 순서: 서비스 소개 → 주요 기능 → 이용 방법 → 모아진 기록 받기
  -->
  <header>
    <h1>병행독서 기록 메모</h1>
    <p>여러 책의 메모를 한 곳에 가볍게 남기고, 그날과 책별의 기록으로 모아 봅니다.</p>    
  </header>
</body>
</html>
